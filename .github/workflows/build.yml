# CI stub — enable once a root CMakeLists.txt exists (Milestone 1).
# Windows + MinGW + Qt 6, build and run ctest (unit tests only).
name: build

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  windows-mingw:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.6.2"
          arch: win64_mingw
          tools: "tools_ninja tools_mingw1120"

      - name: Configure
        run: >
          cmake -G Ninja -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DSHIFTECH_BUILD_TESTS=ON
          -DSHIFTECH_INTEGRATION_TESTS=OFF

      - name: Build
        run: cmake --build build

      - name: Test (unit only)
        run: ctest --test-dir build --output-on-failure
